<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="autohint"  mode="assign"><bool>false</bool></edit>
    <edit name="rgba"      mode="assign"><const>none</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family" compare="eq" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <test name="family" compare="eq" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <test name="family" compare="eq" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family" compare="eq" qual="any"><string>serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family" compare="eq" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family" compare="eq" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family" compare="eq" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <test name="family" compare="eq" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family" compare="eq" qual="any"><string>serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family" compare="eq" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family" compare="eq" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family" compare="eq" qual="any"><string>serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family" compare="eq" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family" compare="eq" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family" compare="eq" qual="any"><string>serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family" compare="eq" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family" compare="eq" qual="first"><string>Noto Sans</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family" compare="eq" qual="first"><string>Noto Serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family" compare="eq" qual="first"><string>Noto Sans Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="font">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq" qual="any"><string>Noto Color Emoji</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
