# yamllint disable rule:line-length
---
patch:
  key_binder/bindings:
    - {when: always, toggle: ascii_punct, accept: Control+Shift+3}
    - {when: always, toggle: ascii_punct, accept: Control+Shift+numbersign}
    - {when: always, toggle: s2t, accept: Control+Shift+4}
    - {when: always, toggle: s2t, accept: Control+Shift+dollar}
    - {when: composing, accept: Alt+Left, send: Shift+Left}
    - {when: composing, accept: Alt+Right, send: Shift+Right}
    - {when: composing, accept: Control+w, send: Control+BackSpace}
    - {when: has_menu, accept: "Control+e", toggle: english_chinese}
    - {when: has_menu, accept: "Control+a", toggle: tone_hint}
    - {when: has_menu, accept: "Control+s", toggle: tone_display}
    - {when: has_menu, accept: "Control+t", toggle: super_tips}
    - {when: has_menu, accept: "Control+g", toggle: charset_filter}
    - {when: composing, accept: "Control+g", toggle: charset_filter}
    - {when: always, accept: Shift+space, select: .next}
    - {when: has_menu, accept: "Tab", send: "Control+Right"}
    - {when: composing, accept: "Tab", send: "Control+Right"}
    - {when: composing, accept: "Control+Tab", send_sequence: '{Home}{Shift+Right}{1}{Shift+Right}'}
    - {accept: Shift+Return, send_sequence: '{option:tone_display=true}{Shift+Return}{option:tone_display=false}'}
    - {match: "^/$", accept: "/", send_sequence: '{space}'}
    - {when: composing, accept: slash, send_sequence: '{space}{slash}{space}'}
    - {when: composing, accept: grave, send_sequence: '{space}{grave}{space}'}
    - {when: composing, accept: semicolon, send_sequence: '{space}{semicolon}'}
    - {when: composing, accept: backslash, send_sequence: '{space}{backslash}'}
  super_processor/select_character: false
  speller/delimiter: " "
  recognizer/patterns/email: "^[A-Za-z][-_.0-9A-Za-z]*@[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?\\.[A-Za-z]{2,}$"
  recognizer/patterns/wanxiang_reverse: "^`[A-Za-z7890;]+$"
